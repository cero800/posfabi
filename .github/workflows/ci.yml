name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Escritorio (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
          sudo apt-get install -y patchelf

      - uses: pnpm/action-setup@v6

      # 24 y no menor: el backend usa `node:sqlite`, que sin bandera
      # experimental solo existe a partir de Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Compila `@tienda/core`, que es lo que consumen los tests de `packages/db`.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm --filter @tienda/desktop exec vite build

      - name: Tests (db + desktop)
        run: pnpm test

      - name: Lint frontend
        run: pnpm --filter @tienda/desktop lint

      - name: Formato Rust
        working-directory: packages/desktop/src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: packages/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests Rust
        working-directory: packages/desktop/src-tauri
        run: cargo test