name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Empaquetar (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar núcleo compartido
        run: pnpm --filter @tienda/core build

      # Sin esto `tauri build` se cae: `externalBin` apunta a
      # `src-tauri/binaries/tienda-db-<tripleta>`, que está en `.gitignore` y no
      # existe en un checkout limpio. El script construye el binario de la
      # máquina que corre, que es exactamente la tripleta que le corresponde a
      # cada runner de la matriz.
      - name: Compilar backend (Node SEA)
        run: pnpm build:sea

      - name: Publicar release (tauri-action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tienda ${{ github.ref_name }}'
          releaseBody: |
            Instalador de escritorio para Linux y Windows.

            - Linux: `deb`, `rpm` y AppImage
            - Windows: instalador NSIS y MSI

            > Los binarios no están firmados; antes de distribuirlos en producción
            > sigue la sección de firma de `SECURITY.md`.
          releaseDraft: true
          prerelease: false
          projectPath: packages/desktop
          args: >-
            ${{ matrix.platform == 'windows' && '--bundles nsis,msi' || '--bundles deb,rpm,appimage' }}