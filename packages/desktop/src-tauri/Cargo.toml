[package]
name = "tienda-desktop"
version = "1.0.17"
description = "POS de papelería y tienda general"
authors = ["you"]
edition = "2021"

[lib]
name = "tienda_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
# Único plugin: lanzar el backend como sidecar y hablarle por stdio.
# Toda la lógica está en `packages/db`; este crate no tiene más.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
# Solo para los tests: comprueban que `rutas_app` serializa los campos con el
# nombre que el frontend espera. En el binario no se usa.
[dev-dependencies]
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
